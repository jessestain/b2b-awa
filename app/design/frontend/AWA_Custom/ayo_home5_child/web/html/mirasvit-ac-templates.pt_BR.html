<script id="searchAutocompletePlaceholder" type="text/x-custom-template">
    <div class="mst-searchautocomplete__autocomplete" data-bind="stopBinding: true">
        <div class="mst-searchautocomplete__spinner">
            <div class="spinner-item spinner-item-1"></div>
            <div class="spinner-item spinner-item-2"></div>
            <div class="spinner-item spinner-item-3"></div>
            <div class="spinner-item spinner-item-4"></div>
        </div>

        <div class="mst-searchautocomplete__close">&times;</div>
    </div>
</script>

<script id="searchAutocompleteWrapper" type="text/x-custom-template">
    <div class="mst-searchautocomplete__wrapper">
        <div class="mst-searchautocomplete__results" data-bind="{
            visible: result().noResults == false,
            css: {
                __all: result().urlAll && result().totalItems > 0
            }
        }">
            <div data-bind="foreach: { data: result().indexes, as: 'index' }">
                <div data-bind="visible: index.totalItems, attr: {class: 'mst-searchautocomplete__index ' + index.identifier}">
                    <div class="mst-searchautocomplete__index-title">
                        <span data-bind="text: index.title"></span>
                        <span data-bind="visible: index.isShowTotals" style="display: none;">
                            (<span data-bind="text: index.totalItems"></span>)
                        </span>
                    </div>

                    <ul data-bind="foreach: { data: index.items, as: 'item' }">
                        <li data-bind="
                            attr: {class: 'mst-searchautocomplete__item ' + index.identifier},
                            event: { mouseover: $parents[1].onMouseOver, mouseout: $parents[1].onMouseOut, mousedown: $parents[1].onClick },
                            css: {_active: $data.isActive}">
                            <!-- ko if: index.identifier == 'popular' -->
                            <a class="awa-search-chip" data-bind="text: query, attr: { title: query, href: url }"></a>
                            <!-- /ko -->
                            <!-- ko ifnot: index.identifier == 'popular' -->
                            <!-- ko template: { name: index.identifier, data: item } --><!-- /ko -->
                            <!-- /ko -->
                        </li>
                    </ul>
                </div>
            </div>

            <div class="mst-searchautocomplete__show-all" data-bind="visible: result().urlAll && result().totalItems > 0">
                <a data-bind="attr: { href: result().urlAll }">
                    <span data-bind="text: result().textAll"></span>
                </a>
            </div>
        </div>

        <div class="mst-searchautocomplete__empty-result" data-bind="visible: result().noResults == true && !loading()">
            <span data-bind="text: result().textEmpty"></span>
        </div>
    </div>
</script>

<script id="popular" type="text/x-custom-template">
    <a class="awa-search-chip" data-bind="text: query, attr: { title: query, href: url }"></a>
</script>

<script id="magento_search_query" type="text/x-custom-template">
    <a class="title" data-bind="text: query_text, attr: {href: url}, highlight"></a> <span class="num_results" data-bind="text: num_results"></span>
</script>

<script id="magento_catalog_product" type="text/x-custom-template">
    <!-- ko if: ($data.imageUrl && $parents[2].config.isShowImage) -->
    <a rel="noreferrer" data-bind="attr: {href: url}">
        <div class="mst-product-image-wrapper"><img data-bind="attr: {src: imageUrl, alt: name || ''}" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="64" height="64" alt="" loading="lazy" decoding="async"/></div>
    </a>
    <!-- /ko -->

    <div class="meta">
        <div class="title">
            <a rel="noreferrer" data-bind="html: name, attr: {href: url}, highlight"></a>

            <!-- ko if: ($data.sku && $parents[2].config.isShowSku) -->
            <span class="sku" data-bind="text: sku, highlight"></span>
            <!-- /ko -->

            <!-- ko if: ($data && $data.fitment) -->
            <div class="awa-ac-product-fitment" data-bind="text: $data.fitment"
                 title="Compatibilidade"
                 aria-label="Compatibilidade do produto"></div>
            <!-- /ko -->
        </div>

        <!-- ko if: ($data.description && $parents[2].config.isShowDescription) -->
        <div class="description" data-bind="text: $data.description, highlight"></div>
        <!-- /ko -->

        <!-- ko if: ($data.stockStatus && $parents[2].config.isShowStockStatus) -->
        <span class="stock_status" data-bind="text: $data.stockStatus, processStockStatus"></span>
        <!-- /ko -->

        <!-- ko if: ($data.addToCartUrl && $parents[2].config.isShowCartButton) -->
        <div class="to-cart">
            <a class="action primary mst__add_to_cart" data-bind="attr: { _href: addToCartUrl }">
                <span>Adicionar ao Carrinho</span>
            </a>
        </div>
        <!-- /ko -->
    </div>

    <!-- ko if: ($data.price && $parents[2].config.isShowPrice) -->
    <div class="store">
        <div data-bind="html: price" class="price"></div>
    </div>
    <!-- /ko -->
</script>
